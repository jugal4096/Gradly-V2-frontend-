name: Gradly V2 Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/production-readiness-2026-10-28

permissions:
  contents: read

concurrency:
  group: gradly-v2-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test academic calculations
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
      - name: Audit dependencies
        run: npm audit --audit-level=high
